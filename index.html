<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>HotelOS — Enterprise Hotel Management & Operations Platform</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('hotelos_theme_mode') || 'system';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full w-full overflow-hidden bg-brand-bg text-brand-text font-sans antialiased selection:bg-brand-primary selection:text-white">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
